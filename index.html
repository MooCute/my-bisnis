:root{--bg1:#fde4ee;--bg2:#e6f4ec;--card:#ffffff;--tx:#4f7a63;--mu:#8aa597;--pk:#f48fb1;--pk2:#c2185b;--pkl:#fde1ec;--bd:#f6d3e0;--gr:#2e7d5b;--rd:#d6456b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b1a22;--bg2:#17261f;--card:#241c21;--tx:#b9dcc9;--mu:#7f9a8b;--pkl:#3a2530;--bd:#4a3039;--pk2:#f48fb1}}
:root[data-theme="dark"]{--bg1:#2b1a22;--bg2:#17261f;--card:#241c21;--tx:#b9dcc9;--mu:#7f9a8b;--pkl:#3a2530;--bd:#4a3039;--pk2:#f48fb1}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:linear-gradient(180deg,var(--bg1),var(--bg2));min-height:100vh}
#app{max-width:720px;margin:0 auto;padding:16px 16px 130px}
h1{font-size:22px;margin:4px 0}h2{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:26px;padding:16px;margin:12px 0;box-shadow:0 6px 20px #f48fb11f}
.hero{background:linear-gradient(135deg,var(--pkl),var(--bg2))}
.big{font-size:30px;font-weight:800;color:var(--pk2)}
.mu{color:var(--mu);font-size:13px}.g{color:var(--gr)}.r{color:var(--rd)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 13px;font-size:13px;cursor:pointer}
.chip.on{background:var(--pk);color:#fff;border-color:var(--pk)}
.btn{background:var(--pk);color:#fff;border:0;border-radius:99px;padding:13px 18px;font-weight:700;font-size:15px;width:100%;cursor:pointer}
.btn.s{width:auto;padding:7px 14px;font-size:13px}.btn.o{background:var(--pkl);color:var(--pk2)}
input,select,textarea{width:100%;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;padding:11px 13px;font-size:15px;margin:4px 0;font-family:inherit}
label{font-size:12px;color:var(--mu);margin-left:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--bd)}
.row:last-child{border:0}.row b{font-weight:700}
.tile{background:var(--card);border:1.5px solid var(--bd);border-radius:22px;padding:16px;text-align:center;cursor:pointer;font-weight:600}
.tile span{display:block;font-size:26px}
.stat{border-radius:20px;padding:12px;background:var(--pkl)}.stat b{display:block;font-size:20px}
.pill{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--pkl);color:var(--pk2);font-weight:700}
.wrap{overflow-x:auto}
#nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:696px;margin:0 auto;background:var(--card);border:1.5px solid var(--bd);border-radius:32px;display:flex;align-items:center;justify-content:space-around;padding:8px;box-shadow:0 8px 30px #f48fb135;z-index:5}
#nav button{background:none;border:0;color:var(--mu);font-size:11px;font-weight:600;padding:8px 10px;border-radius:22px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button span{font-size:20px}#nav button.on{background:var(--pkl);color:var(--pk2)}
#nav .plus{background:var(--pk);color:#fff;width:58px;height:58px;border-radius:50%;font-size:30px;margin-top:-26px;box-shadow:0 6px 16px #f48fb180;justify-content:center}
#m{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:9}
#m>div{background:var(--card);width:100%;max-width:720px;border-radius:28px 28px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
img.ic{width:1.25em;height:1.25em;vertical-align:-.28em;object-fit:contain}.tile span img.ic{width:1.3em;height:1.3em}#nav .plus img.ic{width:42px;height:42px;filter:drop-shadow(0 2px 3px #0003)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;text-align:left}
.card.sm{padding:10px 12px;border-radius:18px;margin:8px 0;box-shadow:0 3px 10px #f48fb11a}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tt{min-width:0;flex:1}
.tt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:600}
.tt .mu{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt{text-align:right;flex:none}.rt b{font-size:14px}.rt .pill{display:inline-block;margin-top:2px}
.det{margin-top:8px;border-top:1px dashed var(--bd);padding-top:6px}
.stk{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sc{flex:1;min-width:136px;display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--pkl);border-radius:14px;padding:4px 5px 4px 10px;font-size:12px}
.sc .mu{font-size:11px}
.ctl{display:flex;align-items:center}
.ctl b{min-width:28px;text-align:center;font-size:15px}
.st{width:28px;height:28px;border-radius:50%;border:0;background:var(--card);color:var(--pk2);font:inherit;font-size:17px;font-weight:600;line-height:1;cursor:pointer;padding:0}
.ib{background:none;border:0;padding:4px;font-size:16px;cursor:pointer;color:inherit;line-height:1}
.xl{display:flex;gap:2px;flex:none}
.chip.sm{padding:4px 11px;font-size:12px}
.w{color:#b86e00}
.lim{display:flex;align-items:center;gap:8px;margin:2px 4px 8px;font-size:12px}
.lim input{width:72px;margin:0;padding:6px 10px;font-size:13px}
details.sum summary{cursor:pointer;font-size:13px;list-style:revert}
details.sum .row.act{background:var(--pkl);border-radius:12px;padding-left:8px;padding-right:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .w{color:#f2b955}}
:root[data-theme="dark"] .w{color:#f2b955}
details.sum .row,.det .row{font-size:13px}
</style></head><body>

function emj(root){const re=new RegExp('('+Object.keys(BI).join('|')+')\uFE0F?','g'),w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];while(w.nextNode())L.push(w.currentNode);
 L.forEach(t=>{const p=t.parentNode;if(!p||/^(OPTION|TEXTAREA|SCRIPT|STYLE)$/.test(p.nodeName)||!re.test(t.data))return;re.lastIndex=0;
  const f=document.createDocumentFragment();let last=0,m;while((m=re.exec(t.data))){f.append(t.data.slice(last,m.index));const i=document.createElement('img');i.src=BT[BI[m[1]]];i.className='ic';f.append(i);last=re.lastIndex}f.append(t.data.slice(last));p.replaceChild(f,t)})}
let page='dash',per='bulan';
const $=id=>document.getElementById(id),v=id=>$(id).value;
function go(p){page=p;cm();r();scrollTo(0,0)}
function cm(){$('m').style.display='none'}
function modal(h){$('mb').innerHTML=h;emj($('mb'));$('m').style.display='flex'}
function range(){const iso=d=>d.toISOString().slice(0,10),t=new Date();
 if(per=='hari')return[today(),today()];
 if(per=='bulan')return[today().slice(0,8)+'01','9999'];
 if(per=='30')return[iso(new Date(Date.now()-29*864e5)),'9999'];return['0','9999']}
const inR=s=>{const[a,b]=range();return s.date>=a&&s.date<=b};
const prod=id=>S.prod.find(p=>p.id==id);
function calc(s){const p=prod(s.pid)||{hpp:0},ship=+s.ship||0;
 if(s.st=='Retur')return{rev:0,fl:S.fees.map(_=>0),fee:0,hpp:0,ship,net:-ship,pay:0,adj:0};
 const rev=s.qty*s.price,fl=S.fees.map(f=>s.ch=='biasa'?0:Math.round(rev*f.p/100)+(+f.f||0)),fee=fl.reduce((a,b)=>a+b,0),hpp=(s.hpp??p.hpp)*s.qty;
 const hasR=s.akt=='tidak'&&s.real!==''&&s.real!=null,adj=hasR?rev-fee-ship-(+s.real):0;return{rev,fl,fee,hpp,ship,adj,net:rev-fee-hpp-ship-adj,pay:rev-fee-ship-adj}}
function agg(l){const o={rev:0,fl:S.fees.map(_=>0),fee:0,hpp:0,ship:0,net:0,pay:0,adj:0};
 l.forEach(s=>{const c=calc(s);['rev','fee','hpp','ship','net','pay','adj'].forEach(k=>o[k]+=c[k]);c.fl.forEach((x,i)=>o.fl[i]+=x)});return o}
const sold=id=>S.sales.filter(s=>s.pid==id&&s.st!='Retur').reduce((a,s)=>a+ +s.qty,0);
const left=p=>p.stock-sold(p.id);
const chips=()=>`<div class="chips">${[['hari','Hari ini'],['bulan','Bulan ini'],['30','30 hari'],['all','Semua']].map(c=>`<span class="chip ${per==c[0]?'on':''}" onclick="per='${c[0]}';r()">${c[1]}</span>`).join('')}</div>`;
const sales=()=>S.sales.filter(inR);

function dm(){const m=S.sales.filter(s=>s.date.startsWith(today().slice(0,7))&&s.st!='Retur'),c=agg(m.filter(isC)).pay,t=agg(m.filter(s=>!isC(s))).pay;return{c,t,all:c+t}}
function dash(){const l=sales(),a=agg(l),h=new Date().getHours(),g=h<11?'pagi':h<15?'siang':h<18?'sore':'malam';
 const exp=S.exp.filter(inR).reduce((x,y)=>x+ +y.amt,0),proc=S.sales.filter(s=>s.st=='Diproses').length,
 low=S.prod.filter(p=>left(p)<=5),noh=S.prod.filter(p=>!p.hpp).length;
 return`<div class="card hero"><div class="mu">LIVE · ${today()}</div><h1>Selamat ${g}, Admin</h1><div class="mu">Omzet periode ini</div><div class="big">${R(a.rev)}</div>${chips()}
 <div class="grid"><div class="stat"><span class="mu">Laba bersih</span><b class="${a.net-exp<0?'r':'g'}">${R(a.net-exp)}</b></div><div class="stat"><span class="mu">Pesanan</span><b>${l.length}</b></div></div></div>
 <div class="card"><h2>💰 Uang bulan ini</h2><div class="row"><span>Total uang masuk</span><b>${R(dm().all)}</b></div><div class="row"><span>✅ Total sudah cair</span><b class="g">${R(dm().c)}</b></div><div class="row"><span>⏳ Belum cair</span><b class="r">${R(dm().t)}</b></div></div>
 <div class="grid"><div class="tile" onclick="go('sales')"><span>📦</span>${proc} pesanan perlu diproses</div><div class="tile" onclick="go('stok')"><span>⚠️</span>${low.length} stok menipis</div>
 <div class="tile" onclick="go('hpp')"><span>🏷️</span>${noh} produk belum ada HPP</div><div class="tile" onclick="go('dana')"><span>💰</span>Dana cair ${R(agg(S.sales.filter(s=>s.st=='Cair')).pay)}</div></div>

function sList(q){q=q.trim().toLowerCase();const qn=q.replace(/[.,\s]/g,'');
 const l=S.sales.filter(s=>{if(!q)return true;const p=prod(s.pid),c=calc(s);return[p?p.name:'',s.buyer,s.ord,s.date].some(x=>String(x||'').toLowerCase().includes(q))||(/^\d+$/.test(qn)&&[s.price,c.rev,Math.round(c.pay)].some(x=>String(x).includes(qn)))}).sort((a,b)=>b.date.localeCompare(a.date));
 return l.map(sRow).join('')||'<p class="mu">Tidak ada transaksi.</p>'}
function salesP(){return`<h1>Penjualan</h1><button class="btn" onclick="saleM()">+ Catat Penjualan</button><button class="btn o" style="margin-top:8px" onclick="go('kalk')">🧮 Hitung admin Shopee</button><input type="search" placeholder="Cari produk, nominal, tanggal, no. order" value="${e(zsq)}" oninput="zsq=this.value;sUp()" style="margin-top:10px"><div class="mu" style="margin:2px 6px">Ketuk transaksi untuk melihat detail dan mengedit.</div><div id="sl">${sList(zsq)}</div>`}
function editS(id){const s=S.sales.find(x=>x.id==id);if(!s)return;
 modal(`<h2>Edit Penjualan</h2><label>Produk</label><select id="esp">${S.prod.some(p=>p.id==s.pid)?'':`<option value="${s.pid}" selected>(produk dihapus)</option>`}${S.prod.map(p=>`<option value="${p.id}" ${p.id==s.pid?'selected':''}>${e(p.name)}</option>`).join('')}</select>
 <label>Jual lewat</label><select id="esc"><option value="shp" ${s.ch!='biasa'?'selected':''}>Shopee (kena admin)</option><option value="biasa" ${s.ch=='biasa'?'selected':''}>Jual biasa (langsung)</option></select>
 <div class="grid"><div><label>Jumlah</label><input id="esq" type="number" inputmode="numeric" value="${s.qty}"></div><div><label>Harga modal /pcs</label><input id="esh" type="number" inputmode="numeric" value="${s.hpp??(prod(s.pid)||{hpp:0}).hpp}"></div></div>
 <div class="grid"><div><label>Harga jual (dia beli) /pcs</label><input id="espr" type="number" inputmode="numeric" value="${s.price}"></div><div><label>Ongkir ditanggung seller</label><input id="ess" type="number" inputmode="numeric" value="${s.ship||0}"></div></div>
 <label>No. order (opsional)</label><input id="eso" value="${e(s.ord||'')}"><label>Nama pembeli</label><input id="esb" list="ebl" value="${e(s.buyer||'')}"><datalist id="ebl">${S.buyers.map(b=>`<option value="${e(b.name)}">`).join('')}</datalist>
 <div class="grid"><div><label>Tanggal</label><input id="esd" type="date" value="${s.date}"></div><div><label>Status pesanan</label><select id="esst">${ST.map(x=>`<option ${x==s.st?'selected':''}>${x}</option>`).join('')}</select></div></div>
 <label>Dana</label><select id="esdn"><option value="0" ${isC(s)?'':'selected'}>⏳ Masih tertahan</option><option value="1" ${isC(s)?'selected':''}>✅ Sudah cair</option></select><br>
 <button class="btn" onclick="saveS('${id}')">Simpan perubahan</button><br><br><button class="btn o" onclick="del('sales','${id}')">🗑️ Hapus penjualan</button>`)}
function saveS(id){const s=S.sales.find(x=>x.id==id),q=+v('esq');if(!s)return;if(!q){$('esq').focus();return}const b=v('esb').trim();
 Object.assign(s,{pid:v('esp'),ch:v('esc'),qty:q,hpp:+v('esh')||0,price:+v('espr')||0,ship:+v('ess')||0,ord:v('eso').trim(),buyer:b,date:v('esd')||s.date,st:v('esst'),cair:v('esdn')=='1'});
 if(b&&!S.buyers.some(x=>x.name.toLowerCase()==b.toLowerCase()))S.buyers.push({id:uid(),name:b,phone:'',addr:''});
 save();cm();r()}
function saleM(){if(!S.prod.length){alert('Tambah barang dulu di halaman Stok');go('stok');return}
 modal(`<h2>Catat Penjualan</h2><label>Produk</label><select id="sp" onchange="sf()">${S.prod.map(p=>`<option value="${p.id}">${e(p.name)} (Shopee ${lS(p)} · Offline ${lO(p)})</option>`).join('')}</select>
 <label>Jual lewat</label><select id="sc" onchange="sf()"><option value="shp">Shopee (kena admin)</option><option value="biasa">Jual biasa (langsung)</option></select>
 <div class="grid"><div><label>Jumlah</label><input id="sq" type="number" value="1" oninput="sx()"></div><div><label>Harga modal /pcs</label><input id="sh" type="number" oninput="sx()"></div></div>
 <div class="grid"><div><label>Harga jual (dia beli) /pcs</label><input id="spr" type="number" oninput="sx()"></div><div><label>Ongkir ditanggung seller</label><input id="ss" type="number" value="0" oninput="sx()"></div></div>
 <div class="stat" id="sv"></div><br><label>No. order (opsional)</label><input id="so" placeholder="Nomor order Shopee"><label>Nama pembeli</label><input id="sb" list="bl" placeholder="Nama pembeli"><datalist id="bl">${S.buyers.map(b=>`<option value="${e(b.name)}">`).join('')}</datalist>
 <div class="grid"><div><label>Tanggal</label><input id="sd" type="date" value="${today()}"></div><div><label>Status pesanan</label><select id="sst">${ST.map(x=>`<option>${x}</option>`).join('')}</select></div></div>
 <label>Dana</label><select id="sdn"><option value="0">⏳ Masih tertahan</option><option value="1">✅ Sudah cair</option></select><br><button class="btn" onclick="addSale()">Simpan (stok otomatis berkurang)</button>`);sf()}
function addSale(){const q=+v('sq');if(!q)return;const p=prod(v('sp')),ch=v('sc'),av=ch=='biasa'?lO(p):lS(p);
 if(q>av&&!confirm('Stok '+(ch=='biasa'?'Offline':'Shopee')+' tidak cukup (sisa '+av+'). Lanjut?'))return;const b=v('sb').trim();
 S.sales.push({id:uid(),pid:p.id,qty:q,price:+v('spr'),hpp:+v('sh'),ch:ch,buyer:b,ord:v('so').trim(),date:v('sd'),ship:+v('ss'),st:v('sst'),cair:v('sdn')=='1'});
 if(b&&!S.buyers.some(x=>x.name.toLowerCase()==b.toLowerCase()))S.buyers.push({id:uid(),name:b,phone:'',addr:''});
 save();cm();r()}

/* ---------- PENGELUARAN ---------- */
function eRow(x){return`<div class="card sm"><div class="hd"><div class="tt"><b>${e(x.name)}</b><div class="mu">${x.date}</div></div><b>${R(x.amt)}</b><span class="xl"><button class="ib" onclick="editE('${x.id}')" aria-label="Edit">✏️</button><button class="ib" onclick="del('exp','${x.id}')" aria-label="Hapus">🗑️</button></span></div></div>`}
function editE(id){const x=S.exp.find(y=>y.id==id);if(!x)return;
 modal(`<h2>Edit Pengeluaran</h2><label>Keterangan</label><input id="exn" value="${e(x.name)}"><div class="grid"><div><label>Nominal</label><input id="exa" type="number" inputmode="numeric" value="${x.amt}"></div><div><label>Tanggal</label><input id="exd" type="date" value="${x.date}"></div></div><br><button class="btn" onclick="saveE('${id}')">Simpan perubahan</button><br><br><button class="btn o" onclick="del('exp','${id}')">🗑️ Hapus pengeluaran</button>`)}
function saveE(id){const x=S.exp.find(y=>y.id==id),n=v('exn').trim(),a=+v('exa');if(!x)return;if(!n||!a)return;x.name=n;x.amt=a;x.date=v('exd')||x.date;save();cm();r()}
function keluar(){const m=S.exp.filter(x=>x.date.startsWith(today().slice(0,7))).reduce((a,x)=>a+ +x.amt,0);
 return`<h1>Pengeluaran Toko</h1><div class="card hero"><div class="mu">Bulan ini</div><div class="big">${R(m)}</div></div><div class="card"><select id="ek"><option>Packing</option><option>Operasional</option><option>Iklan luar</option><option>Gaji / bantuan</option><option>Lainnya</option></select><input id="en" placeholder="Keterangan"><div class="grid"><input id="ea" type="number" inputmode="numeric" placeholder="Nominal"><input id="ed" type="date" value="${today()}"></div><button class="btn" onclick="addExp2()">Simpan Pengeluaran</button></div>${[...S.exp].sort((a,b)=>b.date.localeCompare(a.date)).map(eRow).join('')}`}
function hpp(){return`<h1>HPP & Pengeluaran</h1><div class="card"><h2>HPP per produk / varian</h2>
 ${S.prod.map(p=>`<div class="mu" style="margin-top:8px">${e(p.name)} ${p.sku?'· '+e(p.sku):''}</div><div class="grid" style="grid-template-columns:1fr 1fr 1fr"><div><label>Modal</label><input type="number" value="${p.hpp}" onchange="prod('${p.id}').hpp=+this.value;save();r()"></div><div><label>Jual biasa</label><input type="number" value="${p.price}" onchange="prod('${p.id}').price=+this.value;save();r()"></div><div><label>Jual Shopee</label><input type="number" value="${p.shp||0}" onchange="prod('${p.id}').shp=+this.value;save();r()"></div></div>`).join('')||'<p class="mu">Belum ada produk. Tambah barang dulu di halaman Stok</p>'}</div>
 <div class="card"><h2>Pengeluaran di luar platform</h2><input id="en" placeholder="Mis. Packing, bensin, lakban"><div class="grid"><input id="ea" type="number" placeholder="Nominal"><input id="ed" type="date" value="${today()}"></div><button class="btn" onclick="addExp()">Simpan Pengeluaran</button></div>
 ${[...S.exp].sort((a,b)=>b.date.localeCompare(a.date)).map(eRow).join('')}`}

/* ---------- EKSPOR + LAPORAN ---------- */
function tsv(k){const H={sales:['Tanggal','Produk','Jumlah','Harga','Pembeli','Status','Omzet','Biaya Platform','HPP','Ongkir','Laba Bersih'],prod:['Nama','SKU','Kategori','Tanggal','HPP','Harga Biasa','Harga Shopee','Stok Shopee','Stok Offline','Sisa Total'],exp:['Tanggal','Nama','Nominal']};
 const rows=k=='sales'?S.sales.map(s=>{const c=calc(s),p=prod(s.pid);return[s.date,p?p.name:'',s.qty,s.price,s.buyer,s.st,c.rev,c.fee,c.hpp,c.ship,c.net]}):k=='prod'?S.prod.map(p=>[p.name,p.sku,p.cat||'',p.date||'',p.hpp,p.price,p.shp||0,lS(p),lO(p),lT(p)]):S.exp.map(x=>[x.date,x.name,x.amt]);
 return[H[k],...rows].map(r=>r.join('\t')).join('\n')}
function catRep(){const key=lm=='hari'?ld:ld.slice(0,7),m={};
 S.sales.filter(s=>s.date.startsWith(key)&&s.st!='Retur').forEach(s=>{const p=prod(s.pid),k=(p&&p.cat)||NC,c=calc(s),o=m[k]||(m[k]={n:0,rev:0,net:0});o.n+=+s.qty;o.rev+=c.rev;o.net+=c.net});
 return Object.entries(m).sort((a,b)=>b[1].rev-a[1].rev)}
function lap(){const T=lapT(),cr=catRep();return`<h1>Laporan</h1><div class="chips"><span class="chip ${lm=='hari'?'on':''}" onclick="lm='hari';r()">Harian</span><span class="chip ${lm=='bulan'?'on':''}" onclick="lm='bulan';r()">Bulanan</span></div><input type="date" value="${ld}" onchange="ld=this.value||today();r()"><div class="card"><pre style="white-space:pre-wrap;font-family:inherit;margin:0">${e(T)}</pre></div>
 ${cr.length?`<div class="card"><h2>Per kategori</h2>${cr.map(([k,o])=>`<div class="row"><span>${e(k)}<br><span class="mu">${o.n} pcs · omzet ${R(o.rev)}</span></span><b class="${o.net<0?'r':'g'}">${R(o.net)}</b></div>`).join('')}<div class="mu">Angka kanan = untung bersih sebelum pengeluaran toko.</div></div>`:''}
 <a class="btn" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(T)}">📲 Kirim ke WhatsApp</a>`}

Object.assign(P,{stok,sales:salesP,keluar,hpp,lap});
r();
</script></body></html>
